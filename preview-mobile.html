<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mobile preview — 임시</title>
<meta name="robots" content="noindex,nofollow">
<style>
  body{margin:0;background:#05080c;display:flex;gap:18px;padding:16px;font:12px system-ui,sans-serif;color:#7d8a9c}
  figure{margin:0}
  figcaption{padding:2px 0 6px}
  iframe{border:1px solid #2c3846;border-radius:10px;background:#0b0e13;display:block}
</style>
</head>
<body>
<figure style="flex:0 0 auto">
  <figcaption>1280 × 900</figcaption>
  <iframe src="index.html?pv=1280" width="1280" height="900" title="desktop"></iframe>
</figure>
<figure>
  <figcaption>390 × 844</figcaption>
  <iframe src="index.html?pv=3902" width="390" height="844" title="390px"></iframe>
</figure>
<figure>
  <figcaption>430 × 844</figcaption>
  <iframe src="index.html?pv=4302" width="430" height="844" title="430px"></iframe>
</figure>
</body>
</html>
