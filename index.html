<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<title>KR Terminal — 국내주식 전종목</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="국내 주식 전 종목 시세·외국인 수급·연속 매수 필터·차트·물타기 계산기">
<link rel="stylesheet" href="styles.css?v=20261126c">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230b0e13'/><path d='M22 70 L42 46 L56 58 L78 28' stroke='%234da3ff' stroke-width='8' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">KR</span>
    <div class="brandtxt">
      <strong>KR Terminal</strong>
      <span id="stamp">불러오는 중…</span>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="종목명 · 종목코드 검색  (/)" autocomplete="off" spellcheck="false">
      <button id="qclear" class="qclear" aria-label="검색 지우기">×</button>
    </div>
  </div>
  <div class="strip" id="strip"></div>
</header>

<nav class="tabs" id="tabs">
  <button class="tab active" data-tab="all">종합 <em id="cntAll">–</em></button>
  <button class="tab" data-tab="foreign">외국인 <em id="cntFor">–</em></button>
  <button class="tab" data-tab="inst">기관 <em id="cntInst">–</em></button>
  <button class="tab" data-tab="rose">전일 상승 → 오늘 <em id="cntRose">–</em></button>
  <button class="tab" data-tab="mine">내 종목 <em id="cntMine">0</em></button>
</nav>

<section class="filters" id="filters">
  <div class="fgroup">
    <span class="flabel">시장</span>
    <button class="chip on" data-market="ALL">전체</button>
    <button class="chip" data-market="K">코스피</button>
    <button class="chip" data-market="Q">코스닥</button>
  </div>
  <div class="fgroup roseonly">
    <span class="flabel">전일 상승률</span>
    <button class="chip on" data-r="0">전체</button>
    <button class="chip" data-r="1">+1%↑</button>
    <button class="chip" data-r="3">+3%↑</button>
    <button class="chip" data-r="5">+5%↑</button>
    <button class="chip" data-r="10">+10%↑</button>
  </div>
  <div class="fgroup din">
    <span class="flabel" title="외국인 연속 순매수 일수">외인 연속</span>
    <button class="chip on" data-fp="0">전체</button>
    <button class="chip" data-fp="3">3</button>
    <button class="chip" data-fp="5">5</button>
    <button class="chip" data-fp="10">10</button>
    <span class="numwrap" id="wF"><input id="inF" type="number" min="0" max="99" inputmode="numeric" placeholder="0" aria-label="외국인 연속매수 일수 직접 입력"><i>일+</i></span>
  </div>
  <div class="fgroup din">
    <span class="flabel" title="기관 연속 순매수 일수">기관 연속</span>
    <button class="chip on" data-op="0">전체</button>
    <button class="chip" data-op="3">3</button>
    <button class="chip" data-op="5">5</button>
    <button class="chip" data-op="10">10</button>
    <span class="numwrap" id="wO"><input id="inO" type="number" min="0" max="99" inputmode="numeric" placeholder="0" aria-label="기관 연속매수 일수 직접 입력"><i>일+</i></span>
  </div>
  <div class="fgroup din">
    <span class="flabel" title="주가 연속 상승 일수">연속 상승</span>
    <button class="chip on" data-pp="0">전체</button>
    <button class="chip" data-pp="2">2</button>
    <button class="chip" data-pp="3">3</button>
    <button class="chip" data-pp="5">5</button>
    <span class="numwrap" id="wP"><input id="inP" type="number" min="0" max="99" inputmode="numeric" placeholder="0" aria-label="연속 상승 일수 직접 입력"><i>일+</i></span>
  </div>
  <div class="fgroup scroll">
    <span class="flabel">차트</span>
    <button class="chip on" data-ch="">전체</button>
    <button class="chip" data-ch="b60">60일선 돌파</button>
    <button class="chip" data-ch="b120">120일선 돌파</button>
    <button class="chip" data-ch="a60">60일선 위</button>
    <button class="chip" data-ch="a120">120일선 위</button>
  </div>
  <div class="fgroup">
    <button class="chip toggle" id="both" title="외국인과 기관이 같은 날 모두 순매수한 종목">외인+기관 쌍끌이</button>
  </div>
  <div class="fgroup fgroup-right">
    <button class="chip ghost" id="reset">필터 초기화</button>
  </div>
</section>

<main>
  <div class="rosesum roseonly" id="rosesum" hidden></div>

  <div class="tablebar">
    <div class="tinfo" id="tinfo"></div>
    <div class="tsort" id="tsort"></div>
  </div>

  <div class="tablewrap">
    <table class="tbl" id="tbl">
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" hidden>조건에 맞는 종목이 없습니다.</div>
    <button class="more" id="more" hidden>더 보기</button>
  </div>
</main>

<footer class="foot">
  <span id="srcline">데이터: 네이버 금융 · Yahoo Finance (지연 시세) · 투자 판단의 참고용이며 매매 책임은 본인에게 있습니다.</span>
</footer>

<!-- 종목 상세 -->
<div class="drawer" id="drawer" hidden>
  <div class="drawer-scrim" id="scrim"></div>
  <aside class="panel" role="dialog" aria-modal="true" aria-label="종목 상세">
    <div class="phead">
      <div>
        <div class="pname"><h2 id="dName">–</h2><span class="pcode" id="dCode"></span><span class="ptag" id="dMkt"></span></div>
        <div class="pprice"><strong id="dPrice">–</strong><span id="dChg"></span></div>
      </div>
      <button class="close" id="dClose" aria-label="닫기">×</button>
    </div>
    <div class="pbody" id="dBody"></div>
  </aside>
</div>

<script src="app.js?v=20261126c"></script>
</body>
</html>
